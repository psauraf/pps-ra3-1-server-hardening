<IfModule mod_evasive20.c>
  DOSHashTableSize    3097
  DOSPageCount        10
  DOSSiteCount        50
  DOSPageInterval     1
  DOSSiteInterval     1
  DOSBlockingPeriod   10

  # Log (opcional)
  DOSEmailNotify      admin@localhost
  DOSLogDir           "/var/log/apache2/mod_evasive"
</IfModule>
