# ============================
# PR7 - Apache Hardening (Best Practices)
# ============================

# 1) Ocultar información del servidor
ServerTokens Prod
ServerSignature Off

# 2) Deshabilitar TRACE
TraceEnable Off

# 3) Timeout reducido (mitigación básica)
Timeout 60

# 4) Evitar listado de directorios (si se usa en vhost/dir)
<Directory /var/www/html>
  Options -Indexes
  AllowOverride None
  Require all granted

  # 5) Limitar métodos HTTP (permitimos solo GET/POST/HEAD)
  <LimitExcept GET POST HEAD>
    Require all denied
  </LimitExcept>
</Directory>

# 6) Cabeceras de seguridad básicas
Header always set X-Frame-Options "DENY"
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "no-referrer"
Header always set X-XSS-Protection "1; mode=block"
