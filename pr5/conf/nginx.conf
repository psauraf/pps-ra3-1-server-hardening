worker_processes  1;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Hardening: ocultar versión
  server_tokens off;

  # Logs (ok para práctica)
  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log warn;

  # Rate limiting (DoS básico)
  limit_req_zone $binary_remote_addr zone=req_limit_per_ip:10m rate=5r/s;

  server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No listar directorios
    autoindex off;

    # Limitar métodos (solo lectura)
    if ($request_method !~ ^(GET|HEAD)$ ) { return 405; }

    # Aplicar rate limit
    limit_req zone=req_limit_per_ip burst=10 nodelay;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # CSP (web estática)
    add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # HSTS (solo si HTTPS; en HTTP no aplica)
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location / {
      try_files $uri $uri/ =404;
    }
  }
}
